[project]
name = "documind"
version = "0.1.0"
description = "Chat with your documents: RAG with hybrid search and page-level citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "openai>=1.50",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]
